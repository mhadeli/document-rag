services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: document-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: ragdb
    ports:
      # Bound to localhost only: needed for local dev (README Option B),
      # never exposed on external interfaces.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: document-rag:latest
    container_name: document-rag-backend
    # Bounded retries so a failing migration surfaces as a failed container
    # instead of an endless restart loop.
    restart: on-failure:5
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/ragdb
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # Startup command comes from the Dockerfile CMD (migrations + uvicorn).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    image: document-rag:latest
    container_name: document-rag-frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    command: >
      streamlit run frontend/streamlit_app.py
      --server.port=8501
      --server.address=0.0.0.0

volumes:
  postgres_data:
